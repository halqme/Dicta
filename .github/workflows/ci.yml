name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Verify shared scheme
        run: xcodebuild -list -project Dicta.xcodeproj

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Dicta.xcodeproj \
            -scheme Dicta

      - name: Build and run unit tests
        shell: bash
        run: |
          set -o pipefail
          set +e
          xcodebuild test \
            -project Dicta.xcodeproj \
            -scheme Dicta \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          status=${PIPESTATUS[0]}
          set -e

          if [[ "$status" -ne 0 ]]; then
            diagnostics="$RUNNER_TEMP/xcodebuild-diagnostics.log"
            grep -E '(^|[[:space:]])(error:|Testing failed:|The following build commands failed:)|:[0-9]+:[0-9]+: error:' \
              "$RUNNER_TEMP/xcodebuild.log" | tail -n 200 > "$diagnostics" || true

            {
              echo '### xcodebuild diagnostics'
              echo '```text'
              cat "$diagnostics"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            while IFS= read -r line; do
              [[ -n "$line" ]] && echo "::error::$line"
            done < "$diagnostics"
          fi

          exit "$status"
